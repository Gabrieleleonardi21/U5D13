spring.application.name=biblioteca

# Su Render DATABASE_URL viene tradotta da DatabaseUrl e sovrascrive le tre proprieta' datasource
# Variabili locali da .env (formato KEY=valore), opzionale: se manca valgono i default sotto
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.superuser.email=${SUPERUSER_EMAIL:superuser@biblioteca.it}
# Nessun default: senza SUPERUSER_PASSWORD l'app non parte (niente password nota a tutti)
app.superuser.password=${SUPERUSER_PASSWORD}

# JWT firmato HS256: il secret deve essere >= 32 byte. Nessun default: senza JWT_SECRET l'app non parte
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# Pulizia dei token scaduti dalla tabella token_jwt (cron Spring: sec min ora giorno mese giorno-settimana)
app.jwt.pulizia-cron=${PULIZIA_TOKEN_CRON:0 0 3 * * *}

# Cookie HttpOnly del token: Secure in produzione (https); in locale su http COOKIE_SECURE=false
app.auth.cookie-secure=${COOKIE_SECURE:true}

# In produzione: ALLOWED_ORIGIN=https://<fe>.onrender.com (piu' valori separati da virgola)
app.cors.allowed-origins=${ALLOWED_ORIGIN:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}}

# Paginazione: limite massimo di elementi per pagina
spring.data.web.pageable.max-page-size=100

# Render assegna la porta in PORT
server.port=${PORT:8080}
server.shutdown=graceful

# Health check per Render
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
